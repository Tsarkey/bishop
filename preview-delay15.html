<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Tsarkei — визитка</title>

  <!-- Open Graph / Telegram -->
  <meta property="og:title" content="Tsarkei — визитка">
  <meta property="og:description" content="Галерея изображений, наборы стикеров и тихая фоновая музыка в тёмно-фиолетовой эстетике - с лёгкой долей загадочности.">
  <meta property="og:image" content="https://tsarkey.github.io/bishop/preview-image.png">
  <meta property="og:url" content="https://tsarkey.github.io/bishop/preview-delay15.html">
  <meta property="og:type" content="website">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tsarkei — визитка">
  <meta name="twitter:description" content="Галерея изображений, наборы стикеров и тихая фоновая музыка в тёмно-фиолетовой эстетике - с лёгкой долей загадочности.">
  <meta name="twitter:image" content="https://tsarkey.github.io/bishop/preview-image.png">

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--bg:#0f0814;--accent:#6b3fa0;--muted:#cfc4db}
    body{background:var(--bg);color:var(--muted);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;margin:0;padding:20px;display:flex;align-items:center;justify-content:center;height:100vh}
    .card{max-width:900px;width:100%;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6);background:linear-gradient(180deg, rgba(20,8,30,.65), rgba(8,3,12,.9))}
    img{width:100%;height:auto;display:block}
    .meta{padding:18px}
    h1{margin:.15rem 0;font-size:1.25rem;color:#fff}
    p{margin:.5rem 0 0;font-size:.95rem;line-height:1.35;color:var(--muted)}
    .controls{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{background:var(--accent);color:#fff;padding:8px 14px;border-radius:10px;text-decoration:none;font-weight:600}
    .linklike{color:var(--muted);text-decoration:underline;cursor:pointer}
    .count{font-weight:700;color:#fff;margin-left:6px}
    .small{font-size:.85rem;opacity:.9}
  </style>
</head>
<body>
  <div class="card" role="main" aria-live="polite">
    <img src="https://tsarkey.github.io/bishop/preview-image.png" alt="Tsarkei — превью">
    <div class="meta">
      <h1>Tsarkei — визитка</h1>
      <p class="small">Галерея изображений, наборы стикеров и тихая фоновая музыка в тёмно-фиолетовой эстетике — с лёгкой долей загадочности.</p>

      <div class="controls" id="controls">
        <a class="btn" id="openNow" href="https://tsarkey.github.io/bishop/" rel="noopener">Открыть сайт сейчас</a>
        <span class="small">Автопереход через <span class="count" id="count">15</span> c.</span>
        <a class="linklike" id="cancel">Отменить авто-переход</a>
      </div>
    </div>
  </div>

  <script>
    // Countdown and redirect after 15 seconds
    (function(){
      var seconds = 15;
      var countEl = document.getElementById('count');
      var cancelLink = document.getElementById('cancel');
      var openNow = document.getElementById('openNow');
      var timeoutId = null;
      function tick(){
        seconds--;
        countEl.textContent = seconds;
        if(seconds<=0){
          window.location.href = openNow.href;
        }
      }
      timeoutId = setInterval(tick, 1000);
      cancelLink.addEventListener('click', function(e){
        e.preventDefault();
        if(timeoutId){ clearInterval(timeoutId); timeoutId = null; document.getElementById('count').textContent = '—'; cancelLink.textContent = 'Авто-переход отменён'; }
      }, false);
      // Accessibility: announce countdown
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        // if user prefers reduced motion, skip auto redirect
        clearInterval(timeoutId); document.getElementById('count').textContent = '—';
      }
    })();
  </script>
</body>
</html>
